name: forecast
on:
  schedule:
    - cron: '50 * * * *'
  push:
    branches: [main]
    paths: ['scripts/forecast.py', 'scripts/rate.py', 'scripts/build_site.py', 'scripts/page.html', 'sites.json', '.github/workflows/forecast.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: forecast
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy requests numcodecs pandas pyarrow
      - run: python scripts/forecast.py
      - run: |
          if [ ! -f data/climo.parquet ]; then python scripts/climo.py; fi
          python scripts/build_site.py
          cp data/forecast_meta.json site/
          touch site/.nojekyll
      - name: Keep a copy on the gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
