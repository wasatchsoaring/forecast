name: probe
on:
  push:
    branches: [main]
    paths: ['scripts/probe.py', '.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy requests numcodecs
      - run: python scripts/probe.py 2>&1 | tee probe/log.txt
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "probe results" || exit 0
          git pull --rebase
          git push
