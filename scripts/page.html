<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wasatch Paragliding Forecast</title>
<meta name="description" content="Paragliding forecasts for Wasatch and Utah sites, rated against years of HRRR history.">
<style>
:root{--navy:#0d1b2e;--blue:#4aa8ff;--link:#2a7de1;--bg:#ffffff;--band:#f5f7fa;--ink:#16202c;--soft:#667085;--line:#e6e9ee;--card:#fff;--chip:#eef4ff;--good:#e9f8ee}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--band:#0f1829;--ink:#e7ebf2;--soft:#93a0b4;--line:#1f2b3e;--card:#111b2d;--chip:#16243b;--good:#10261a;--link:#4aa8ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
.hero{background:var(--navy);color:#fff;padding:30px 20px 26px}
.wrap{max-width:1000px;margin:0 auto}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:700}
.hero h1{margin:10px 0 12px;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.hero h1 span{color:var(--blue);display:block}
.hero .date{font-size:16px}
.hero .beta{font-size:12px;color:#c7d2e0;background:#16263d;border:1px solid #24395a;border-radius:8px;padding:8px 10px;margin:0 0 14px;max-width:560px}
.hero .flyable{color:var(--blue);font-size:13px;margin-top:4px}
.hero .upd{color:#8b9ab0;font-size:11.5px;margin-top:6px}
.band{background:var(--band);border-bottom:1px solid var(--line);padding:16px 20px}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:10px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.day{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:62px;padding:8px 6px;text-align:center;cursor:pointer;color:var(--ink);font:inherit}
.day b{display:block;font-size:13px}
.day .e{font-size:18px;line-height:1.5;display:block}
.day small{color:var(--soft);font-size:11.5px}
.day.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.day.on b{color:var(--blue)}.day.on small{color:#c7d2e0}
.refs{display:flex;gap:28px;flex-wrap:wrap}
.refs div{font-size:12.5px;color:var(--soft)}
.refs b{display:block;color:var(--ink);font-size:21px;font-weight:700}
.refs b small{font-size:12.5px;font-weight:400;color:var(--soft)}
.note{font-size:12px;color:var(--soft);margin-top:8px}
section.region{padding:22px 20px 8px}
.rhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.rhead .label{margin:0}
.rhead span{font-size:12px;color:var(--soft)}
.howto{border:1px solid var(--line);background:var(--band);border-radius:12px;padding:14px;margin:0 20px}
.howto p{margin:0 0 10px;font-size:13px}
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ladder div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;color:var(--soft)}
.ladder b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.howto .foot2{margin-top:10px;font-size:12px;color:var(--soft)}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px}
.grid th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:700;text-align:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.grid th:first-child,.grid td:first-child{text-align:left}
.grid td{padding:11px 4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid td.site a{color:var(--link);text-decoration:none;font-weight:500}
.grid td.site small{display:block;font-size:10.5px;color:var(--soft);margin-top:2px}
.grid td.type span{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:5px;background:var(--chip);color:var(--link)}
.grid td.type span.ridge{background:var(--good);color:#18864a}
.grid td.tops{text-align:right;font-weight:500}
.grid td.tops small{display:block;font-size:10.5px;color:var(--soft);font-weight:400}
.grid .dash{color:#b6bfcc}
.grid .nodata{color:transparent}
.cellw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.also{font-size:12.5px;color:var(--soft);margin:10px 0 0}
.also a{color:var(--soft)}
.foot{max-width:1000px;margin:0 auto;padding:18px 20px 50px;font-size:12.5px;color:var(--soft)}
.foot p{margin:8px 0}
#sitepage{padding:18px 20px 40px}
.back{font-size:13px;color:var(--link);text-decoration:none}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--soft);margin:10px 0 14px}
.facts b{color:var(--ink)}
.facts a{color:var(--link)}
.dayblock{margin:18px 0 6px}
.dayblock h3{font-size:15px;margin:0 0 4px}
.dayblock .sum{font-size:12.5px;color:var(--soft);margin-bottom:6px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table.hours{border-collapse:collapse;font-size:12.5px;min-width:760px;width:100%}
.hours th{background:var(--band);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding:7px 8px;text-align:right;white-space:nowrap}
.hours td{padding:7px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.hours th:first-child,.hours td:first-child,.hours th:nth-child(2),.hours td:nth-child(2){text-align:left}
.hours tr.slot td:first-child{font-weight:700}
.hours tr.dark td{color:var(--soft)}
.arrow{display:inline-block;width:12px;text-align:center}
.chartbox{border:1px solid var(--line);background:var(--band);border-radius:12px;padding:14px;margin:6px 0 4px}
.chart{width:100%;height:auto;color:var(--ink)}
@media (max-width:560px){
  .hero h1{font-size:26px}
  .grid td.type,.grid th.type{display:none}
  .grid td,.grid th{padding-left:2px;padding-right:2px}
  .cellw{font-size:11.5px}
  section.region,.band,#sitepage{padding-left:14px;padding-right:14px}.howto{margin:0 14px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = /*DATA*/null;
const EMO = {"-1": "—", 0: "🤔", 1: "👍", 2: "🦅", 3: "🔥", 4: "💥"};
const NAME = {0: "Marginal", 1: "Soarable", 2: "Strong thermals", 3: "Top 25% day", 4: "Top 5% day"};
const DIRS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = d => d == null ? "" : DIRS[Math.round(d / 22.5) % 16];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ft = v => v == null ? "—" : v >= 18000 ? "18,000+" : Math.round(v).toLocaleString();
const hourName = h => h === 12 ? "12 pm" : h > 12 ? (h - 12) + " pm" : h + " am";
const slotHead = h => h === 12 ? "12PM" : h > 12 ? (h - 12) + "PM" : h + "AM";
const dayLong = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric"});
const dayShort = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", {weekday: "short"});
const dayNum = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", {month: "short", day: "numeric"});
const arrow = d => d == null ? "" : `<span class="arrow" style="transform:rotate(${(d + 180) % 360}deg)">↑</span>`;
const utahNow = () => new Date(new Date().toLocaleString("en-US", {timeZone: "America/Denver"}));
const isoUtah = () => { const n = utahNow(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`; };

let D, sel;

function cell(sl) {
  if (!sl) return `<td class="nodata">·</td>`;
  if (sl.lv < 0) return `<td class="dash" title="${sl.dark ? "After sunset" : sl.storm ? "Storm or rain" : "Wind outside the launch limits"}">—</td>`;
  return `<td class="cellw" title="${NAME[sl.lv]}">${EMO[sl.lv]}${sl.wind ?? ""}${compass(sl.dir)}</td>`;
}

function footer() {
  return `<div class="foot">
    <p><b>Where the numbers come from.</b> NOAA's HRRR model (3 km grid), read from the University of Utah HRRR-Zarr archive: the newest 48-hour run, with the newest hourly run laid over it. Top 25% and Top 5% compare against this site's HRRR history from ${esc(D.history.from)} to ${esc(D.history.to)}, within ${D.history.window_days} days of the date.</p>
    <p><b>Launch limits.</b> From the UHGPGA and CUASA site guides and paraglidingmap.com. Wales and Ken's Lake use the slope direction from a terrain model until someone who flies them confirms.</p>
    <p>A model, not a weather station. Check live wind and the NWS soaring forecast before you launch.</p>
  </div>`;
}

function renderMain() {
  const dates = D.dates;
  const flyableCount = d => D.sites.filter(s => s.days[d] && s.days[d].best >= 0).length;
  const bestOf = d => Math.max(-1, ...D.sites.map(s => s.days[d] ? s.days[d].best : -1));
  const run = D.run.newest_run ? D.run.newest_run.slice(11, 13) + "Z" : "";
  const built = new Date(D.built).toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/Denver"});
  let h = `<header class="hero"><div class="wrap">
    <div class="kicker">Updated hourly · HRRR 3 km · Beta</div>
    <h1>Wasatch<span>Paragliding Forecast</span></h1>
    <div class="beta">Beta: still being checked against real flights. Some launch limits are estimates. Use it alongside the NWS soaring forecast and live wind, not instead of them.</div>
    <div class="date">${esc(dayLong(sel))}</div>
    <div class="flyable">${flyableCount(sel)} of ${D.sites.length} sites flyable</div>
    <div class="upd">Last updated: ${esc(built)} Utah time · HRRR ${esc(run)} run</div>
  </div></header>
  <div class="band"><div class="wrap"><div class="label">Forecast days</div><div class="days">
    ${dates.map(d => `<button class="day${d === sel ? " on" : ""}" data-d="${d}"><b>${dayShort(d)}</b><span class="e">${bestOf(d) >= 0 ? EMO[bestOf(d)] : "—"}</span><small>${dayNum(d)}</small></button>`).join("")}
  </div><div class="note">HRRR runs 48 hours ahead, so the last day may only have its morning.</div></div></div>`;
  const ref = (D.reference || {})[sel] || [];
  if (ref.length) h += `<div class="band"><div class="wrap"><div class="label">Boundary layer tops at 2 pm</div><div class="refs">
    ${ref.map(r => `<div>${esc(r.name)}<b>${ft(r.ft)} <small>ft</small></b></div>`).join("")}</div>
    <div class="note">Above sea level, a proxy for the inversion height.</div></div></div>`;
  h += `<div class="wrap" style="padding-top:20px"><div class="howto"><div class="label">How to read the table</div>
    <p>Each cell shows a rating, then the wind at launch height in mph and its direction. For example, 👍8W means 8 mph from the west. A dash means the site isn't flyable then: wind outside the launch limits, storms, or before sunrise or after sunset. ☀ under each site is that day's sunrise and sunset there; 🥾 marks hike and fly launches. Each rating builds on the one before it.</p>
    <div class="ladder">
      <div><b>🤔 Marginal</b>Passes the flyability checks, but soarable height is less than 500 ft over launch. Check the winds aloft.</div>
      <div><b>👍 Soarable</b>Soarable height is at least 500 ft over launch, or a ridge site has soaring wind.</div>
      <div><b>🦅 Strong thermals</b>Soarable, and average thermals are 3 m/s or more.</div>
      <div><b>🔥 Top 25% day</b>Strong thermals, and soarable height in the top 25% of this site's days at this time of year.</div>
      <div><b>💥 Top 5% day</b>Strong thermals, and soarable height in the top 5% of this site's days at this time of year.</div>
    </div>
    <div class="foot2">Soarable height is where thermals fade to about 1 m/s, capped at cumulus base and at 18,000 ft (Class A). Tops is the day's best soarable height, with the boundary layer (BL) top under it. Strong days often let you climb close to the BL top. Tap a site name for its hour-by-hour forecast.</div>
  </div></div>`;
  for (const region of D.regions) {
    const list = D.sites.filter(s => s.region === region);
    if (!list.length) continue;
    const fly = list.filter(s => s.days[sel] && s.days[sel].best >= 0).sort((a, b) => (b.days[sel].tops ?? 0) - (a.days[sel].tops ?? 0));
    const no = list.filter(s => !fly.includes(s));
    h += `<section class="region"><div class="wrap"><div class="rhead"><div class="label">${esc(region)} · ${esc(dayShort(sel))}</div><span>${fly.length} of ${list.length} flyable</span></div>`;
    if (fly.length) {
      h += `<table class="grid"><tr><th>Site</th><th class="type">Type</th>${D.slots.map(s => `<th>${slotHead(s)}</th>`).join("")}<th style="text-align:right">Tops ft</th></tr>`;
      for (const s of fly) {
        const d = s.days[sel];
        h += `<tr><td class="site"><a href="#/site/${s.id}">${esc(s.name)} →</a><small>${s.hike ? "🥾 hike & fly · " : ""}${d.sun && d.sun.rise ? "☀ " + d.sun.rise.replace(" am", "a").replace(" pm", "p") + "–" + d.sun.set.replace(" am", "a").replace(" pm", "p") : ""}</small></td><td class="type"><span class="${s.type}">${s.type === "ridge" ? "RIDGE" : "THERMAL"}</span></td>${D.slots.map(sl => cell(d.slots[String(sl)])).join("")}<td class="tops">${ft(d.tops)}${d.bltop ? `<small>BL ${ft(d.bltop)}</small>` : ""}</td></tr>`;
      }
      h += `</table>`;
    }
    if (no.length) h += `<p class="also">${fly.length ? "Also assessed, not flyable:" : "Not flyable:"} ${no.map(s => `<a href="#/site/${s.id}">${esc(s.name)}</a>`).join(" · ")}</p>`;
    h += `</div></section>`;
  }
  h += footer();
  document.getElementById("app").innerHTML = h;
  document.querySelectorAll(".day").forEach(b => b.onclick = () => { sel = b.dataset.d; renderMain(); });
}

function renderSite(id) {
  const s = D.sites.find(x => x.id === id);
  if (!s) { location.hash = ""; return; }
  const lim = s.launches.map(L => `${esc(L.name)} launch: ${L.ok ? compass(L.ok[0]) + " to " + compass(L.ok[1]) : "any direction"}, ${L.min} to ${L.max} mph`).join(" · ");
  let h = `<header class="hero"><div class="wrap"><div class="kicker">${esc(s.region)}</div><h1>${esc(s.name)}<span>Hourly forecast</span></h1>
    <div class="upd">${s.type === "ridge" ? "Ridge" : "Thermal"} site${s.hike ? " · 🥾 hike and fly" : ""}${s.launch_ft ? " · launch " + s.launch_ft.toLocaleString() + " ft" : ""}</div></div></header>
    <div id="sitepage"><div class="wrap"><a class="back" href="#">← All sites</a>
    <div class="facts"><span><b>Launches</b> ${lim}</span><span><b>Source</b> ${esc(s.src)}</span>${s.best_time ? `<span><b>Notes</b> ${esc(s.best_time)}</span>` : ""}
    <span><a href="https://www.google.com/maps?q=${s.lat},${s.lon}" target="_blank" rel="noopener">Map</a></span></div>`;
  h += chart(s);
  for (const d of D.dates) {
    const day = s.days[d], hrs = s.hours[d];
    if (!day || !hrs) continue;
    const best = Math.max(...hrs.map(r => r.lv));
    const pct = day.pct != null && day.best_over != null ? `Best soarable height ${ft(day.best_over)} ft over launch, better than ${Math.round(day.pct)}% of ${day.n_hist} history days around this date.` : "";
    const sun = day.sun && day.sun.rise ? `<div class="sum">☀ Sunrise ${esc(day.sun.rise)} · sunset ${esc(day.sun.set)} at the launch. Part 103 also allows the 30 minutes before sunrise and after sunset (${esc(day.sun.tw_start)} to ${esc(day.sun.tw_end)}), but only with an anticollision light visible for 3 miles and only in uncontrolled (Class G) airspace.</div>` : "";
    h += `<div class="dayblock"><h3>${esc(dayLong(d))} · ${best >= 0 ? EMO[best] + " " + NAME[best] : "not flyable"}</h3>${sun}<div class="sum">${pct}</div>
      <div class="scroll"><table class="hours"><tr><th>Time</th><th>Rating</th><th>Soarable ft</th><th>Over launch</th><th>Launch wind</th><th>Wind aloft</th><th>Thermals</th><th>BL top ft</th><th>Cu base</th><th>Cloud</th><th>Temp / dew</th></tr>
      ${hrs.map(r => `<tr class="${D.slots.includes(r.h) ? "slot" : ""}${r.dark ? " dark" : ""}"><td>${hourName(r.h)}</td><td>${r.lv >= 0 ? EMO[r.lv] + " " + NAME[r.lv] : r.dark ? "dark" : r.storm || r.rain ? "⚡ storm or rain" : "— wind out of limits"}</td>
        <td>${ft(r.soar)}</td><td>${r.over == null ? "" : r.over.toLocaleString()}</td><td>${arrow(r.dir)} ${r.wind ?? ""} ${compass(r.dir)}</td><td>${arrow(r.bldir)} ${r.bl ?? ""} ${compass(r.bldir)}</td>
        <td>${r.w == null ? "" : r.w.toFixed(1) + " m/s"}</td><td>${ft(r.bltop)}</td><td>${r.cu ? ft(r.base) : "none"}</td><td>${r.cloud ?? ""}%</td><td>${r.t ?? ""}° / ${r.td ?? ""}°F</td></tr>`).join("")}
      </table></div></div>`;
  }
  h += `<p class="note">Winds in mph. Launch wind is at launch height; wind aloft is the average through the thermal layer. Thermals is W*, the average thermal strength. Bold times are the ones on the main table.</p></div></div>` + footer();
  document.getElementById("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function chart(s) {
  const ds = D.dates.filter(d => s.days[d]);
  if (!ds.length) return "";
  const col = lv => lv >= 3 ? "#38bdf8" : lv === 2 ? "#7dd3fc" : lv >= 0 ? "#bae6fd" : "#e2e8f0";
  const vals = ds.map(d => s.days[d].bar || 0).concat([s.p95 || 0, s.launch_ft || 0]);
  const top = Math.max(...vals) * 1.08 || 1, W = 560, H = 196, base = 160, bw = Math.min(90, (W - 20) / ds.length - 16);
  const y = v => base - (v / top) * (base - 14);
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Soarable tops by day for ${esc(s.name)}">`;
  for (const [k, v, c] of [["p75", s.p75, "#94a3b8"], ["p95", s.p95, "#0ea5e9"]]) if (v) svg += `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-dasharray="4 3"/><text x="${W - 4}" y="${y(v) - 3}" text-anchor="end" font-size="10" fill="${c}">${k} ${ft(v)} ft</text>`;
  if (s.launch_ft) svg += `<line x1="0" x2="${W}" y1="${y(s.launch_ft)}" y2="${y(s.launch_ft)}" stroke="#cbd5e1"/><text x="4" y="${y(s.launch_ft) - 3}" font-size="10" fill="#94a3b8">launch</text>`;
  ds.forEach((d, i) => {
    const day = s.days[d], x = 14 + i * ((W - 28) / ds.length) + ((W - 28) / ds.length - bw) / 2, v = day.bar || 0;
    svg += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${base - y(v)}" rx="4" fill="${col(day.bar_lv ?? day.best)}"/>`;
    svg += `<text x="${x + bw / 2}" y="${y(v) - 4}" text-anchor="middle" font-size="10" font-weight="600" fill="currentColor">${v ? ft(v) : ""}</text>`;
    svg += `<text x="${x + bw / 2}" y="${base + 18}" text-anchor="middle" font-size="10" fill="#64748b">${esc(dayShort(d))} ${esc(dayNum(d).split(" ")[1])}</text>`;
  });
  svg += `</svg>`;
  return `<div class="chartbox"><div class="label">Soarable tops by day</div>${svg}
    <div class="note">Bar height is the soarable height in the day's best-rated hour (ft above sea level). Colour is that rating: bright 🔥 or 💥, mid 🦅, pale 👍 or 🤔, grey not flyable. Dashed lines are this site's 75th and 95th percentile days at this time of year, the Top 25% and Top 5% marks.</div></div>`;
}

function route() {
  const m = location.hash.match(/^#\/site\/([\w-]+)/);
  if (m) renderSite(m[1]); else renderMain();
}

(async () => {
  D = DATA || await fetch("forecast.json", {cache: "no-store"}).then(r => r.json());
  const today = isoUtah();
  const late = utahNow().getHours() >= 17;
  const future = D.dates.filter(d => d > today);
  sel = D.dates.includes(today) && !late ? today : (future[0] || D.dates[0]);
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
